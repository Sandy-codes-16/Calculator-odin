<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>CALCULATOR</h2>
        <h3>BY SANDY</h3>
    </div>

    <div class="main-area">
        <div class="calc-body">
                <span id="text-area">0</span>
                <div id="row-one">
                    <span id="nine">9</span>
                    <span id="eight">8</span>
                    <span id="seven">7</span>
                    <span id="all-clear">C</span>
                </div>
                <div id="row-two">
                    <span id="six">6</span>
                    <span id="five">5</span>
                    <span id="four">4</span>
                    <span id="plus">+</span>
                </div>
                <div id="row-three">
                    <span id="three">3</span>
                    <span id="two">2</span>
                    <span id="one">1</span>
                    <span id="minus">-</span>
                </div>
                <div id="row-four">
                    <span id="zero">0</span>
                    <span id="divide">/</span>
                    <span id="multiply">X</span>
                    <span id="equals">=</span>
                </div>
        </div>
    </div>
